appId: com.zhaogegongdada.ui
productName: 找个工打打
directories:
  buildResources: build
icon: resources/icon.png
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!**/*.{map,ts,flow,scss,sass,less}'
  - '!node_modules/date-fns/esm/*'
  - '!node_modules/highlight.js/{styles,scss}/*'
  - '!node_modules/typeorm/browser/*'
  # Exclude unused typeorm optional dependencies
  - '!node_modules/@google-cloud/**'
  - '!node_modules/mongodb/**'
  - '!node_modules/ioredis/**'
  - '!node_modules/redis/**'
  - '!node_modules/hdb-pool/**'
  - '!node_modules/oracledb/**'
  - '!node_modules/@sap/hana-client/**'
  - '!node_modules/better-sqlite3/**'
asarUnpack:
  - 'resources/**'
win:
  executableName: dagegong
nsis:
  artifactName: dagegong_${version}_${arch}_setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: dagegong_${version}_${arch}.${ext}
linux:
  artifactName: dagegong_${version}_${arch}.${ext}
  maintainer: 找个工打打
  category: Utility
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
